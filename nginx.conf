#
# Interactive VLM Feedback Loop — edge nginx (reverse proxy).
#
# Routes:
#   /v1/*    → backend:8000  (REST + SSE)
#   /health  → backend:8000
#   /        → ui:3000       (Vite static bundle)
#
# Follows the nginx pattern from the Retail Catalog Enrichment and Retail
# Agentic Commerce Blueprints: proxy_buffering off + 300s timeouts
# for streaming responses so SSE chunks are flushed to the browser
# immediately (spec §1.3).

events {
    worker_connections 1024;
}

http {
    # Image uploads aren't part of the flow (images are by reference), but scan
    # previews and ingest payloads can be large JSON arrays — 50M is generous.
    client_max_body_size 50M;

    upstream ui {
        server ui:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;

        # ── Backend: REST + SSE ──────────────────────────────────────────
        #
        # The `/v1/projects/{project_id}/events` SSE endpoint is long-lived and
        # chunked. Any proxy-level buffering would batch events and defeat the
        # live-update channel (§1.3 "SSE is the primary UI update channel").
        location /v1/ {
            proxy_pass http://backend/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE-friendly: don't buffer responses or requests
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_set_header Connection "";

            # Long timeouts for SSE (background runs can stream for minutes),
            # evaluation, batch labeling, and embedding workflows.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 30s;
        }

        # ── Backend: health ──────────────────────────────────────────────
        location = /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Backend: interactive API docs ────────────────────────────────
        #
        # docs/API.md points developers at the runtime Swagger UI / ReDoc for
        # the full endpoint surface; without these routes the SPA catch-all
        # below would swallow http://localhost:3000/docs in containerized
        # mode. Swagger UI fetches /openapi.json from the site root.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Frontend SPA (default) ───────────────────────────────────────
        location / {
            proxy_pass http://ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
