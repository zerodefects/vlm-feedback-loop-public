#
# Interactive VLM Feedback Loop — Docker Compose
#
# Prerequisites (run once on the host):
#   1. Install Docker + Docker Compose v2
#   2. Export NVIDIA_API_KEY (hosted NIM) and/or NGC_API_KEY (local NIM) in
#      the shell — or put them in a repo-root .env file, which compose reads
#      for the ${VAR:-} interpolations below. (~/.vlm_feedback_loop is NOT
#      read in containerized mode; the image seeds its own config.yaml.)
#
# Launch:
#   docker compose up --build
#
# Open:  http://localhost:3000
#
# Environment overrides (see README "Containerized Blueprint mode"):
#   EDGE_BIND_HOST         host bind for edge nginx            (default 127.0.0.1)
#   EDGE_PORT              host port for the edge nginx        (default 3000)
#   IMAGE_ROOT             host path to ingestible images     (default ./deploy/example-images)
#   NVIDIA_API_KEY         hosted NIM API key
#   NGC_API_KEY            NGC key for local NIM image pulls
#   TAO_*                  TAO FTMS credentials (optional; fine-tuning)
#   TAO_JOB_TIMEOUT_MINUTES  TAO stale-job ceiling           (default 1440)
#   HF_TOKEN               HuggingFace token (optional; remote TAO base pulls)
#   ALLOW_UI_SECRET_PERSIST  UI may write keys to in-container .env (default false)
#   LOG_LEVEL              info | debug                        (default info)

services:
  # Edge reverse proxy: /v1/ + /health → backend (SSE-safe), / → ui
  nginx:
    image: nginx:1.27-alpine
    container_name: vlm-feedback-loop-nginx
    ports:
      - "${EDGE_BIND_HOST:-127.0.0.1}:${EDGE_PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ui
    restart: unless-stopped
    networks:
      - vlm-feedback-loop

  # FastAPI backend
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: vlm-feedback-loop-backend
    environment:
      # Override workspace so it resolves inside the container. The backend's
      # config.yaml (mounted below) may hold a host-local path; process env
      # takes precedence over config.yaml per spec §1.9.
      - WORKSPACE_ROOT=/data/workspace
      # One image root drives the picker and its containment boundary. When
      # unset, Compose mounts the bundled sample at /data/images and the
      # Ingest screen opens there automatically.
      - IMAGE_ROOT=${IMAGE_ROOT:-/data/images}
      # Secrets — pulled from the shell environment or a top-level .env
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NGC_API_KEY=${NGC_API_KEY:-}
      - TAO_API_KEY=${TAO_API_KEY:-}
      - TAO_API_BASE_URL=${TAO_API_BASE_URL:-}
      - TAO_ORG_NAME=${TAO_ORG_NAME:-}
      # Per-job stale-heartbeat ceiling. cosmos-rl remains quiet during
      # training, so omitting this would restore FTMS's unsafe 60-minute
      # default. The Student Training preflight verifies server support.
      - TAO_JOB_TIMEOUT_MINUTES=${TAO_JOB_TIMEOUT_MINUTES:-1440}
      # TAO workspace S3 credentials (§9.7.8.2) — dataset uploads to the
      # FTMS-side bucket. Optional; only needed for fine-tuning.
      - TAO_WORKSPACE_S3_ACCESS_KEY=${TAO_WORKSPACE_S3_ACCESS_KEY:-}
      - TAO_WORKSPACE_S3_SECRET_KEY=${TAO_WORKSPACE_S3_SECRET_KEY:-}
      # HuggingFace token for gated Cosmos base-model pulls. In containerized
      # mode it is used by first-run base provisioning and injected into
      # remote TAO training jobs. The local LoRA-merge subprocess that also
      # reads it remains local-source-only. Optional unless a selected
      # Student base still needs to be provisioned.
      - HF_TOKEN=${HF_TOKEN:-}
      # UI secret persistence is OFF in containers (spec §12.1: set false
      # where .env is managed externally): a key "saved" from the UI would
      # land in /home/appuser inside the container's ephemeral layer — no
      # volume covers it — and silently vanish on the next recreate. Keys
      # pasted in the UI still apply for the process lifetime; persistent
      # keys belong in the shell env / repo-root .env that compose reads.
      # Override to true only with a persistent /home/appuser mount.
      - ALLOW_UI_SECRET_PERSIST=${ALLOW_UI_SECRET_PERSIST:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Project data workspace: SQLite DBs, exports, artifacts, logs persist
      # here. Uses a Docker named volume by default — inspect with
      # `docker volume inspect vlm-feedback-loop-workspace`. Switch to a bind
      # mount by replacing this line with
      #   - ${VLM_WORKSPACE_HOST}:/data/workspace
      # where VLM_WORKSPACE_HOST is a host dir writable by uid 1001.
      - workspace:/data/workspace
      # Image directories for ingestion. Mounted at the SAME path inside the
      # container so persisted `storage_ref` values resolve consistently in
      # both dev and containerized modes (spec §1.7).
      - ${IMAGE_ROOT:-./deploy/example-images}:${IMAGE_ROOT:-/data/images}:ro
      # Optional: mount a custom config.yaml over the image's default.
      # Must be readable by uid 1001 (the container's appuser). Example:
      # - ./my-config.yaml:/home/appuser/.vlm_feedback_loop/config.yaml:ro
    restart: unless-stopped
    networks:
      - vlm-feedback-loop
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Vite SPA served by nginx:alpine (static bundle with SPA fallback)
  ui:
    build:
      context: src/ui
      dockerfile: Dockerfile
    container_name: vlm-feedback-loop-ui
    restart: unless-stopped
    networks:
      - vlm-feedback-loop

networks:
  vlm-feedback-loop:
    driver: bridge

volumes:
  # Named volume for project data. Docker seeds ownership from the image
  # mount point (uid 1001 / appuser).
  workspace:
    name: vlm-feedback-loop-workspace
