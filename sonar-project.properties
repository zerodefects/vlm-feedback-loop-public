# SonarQube project configuration, scanned by .github/workflows/sonarqube.yml
# (NVIDIA-AI-Blueprints/sonarqube-workflows reusable template). Mirrors the
# sibling retail Blueprints: explicit exclusions + a blocking quality gate.
sonar.projectName=vlm-feedback-loop
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=.
# Product code lives in src/ and tests/. Documentation, scripts, and sample
# data are not product code and would drown the dashboard in noise.
sonar.exclusions=**/.git/**,.github/**,**/node_modules/**,**/__pycache__/**,**/.venv/**,docs/**,scripts/**,deploy/**,src/ui/assets/**,**/*.tgz

# No sonar.language pin: the scanner auto-detects per-file languages, and the
# repo is Python (backend) + TypeScript (src/ui). The deprecated `language`
# property would silently skip the TS half.
sonar.python.coverage.reportPaths=coverage.xml
# Backend unit coverage only: UI has no LCOV wiring in CI, and migrations are
# imperative side-effect modules validated by end-to-end DB tests.
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/conftest.py,**/__init__.py,src/ui/**,src/backend/vlm_feedback_loop/migrations/**

sonar.qualitygate.wait=true
