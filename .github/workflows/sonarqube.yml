#
# SonarQube SAST + supply-chain analysis. Delegates to the
# org-managed reusable template — which is PRIVATE to the
# NVIDIA-AI-Blueprints org, so the job is gated on repository owner
# and skips cleanly on forks/mirrors (where it would otherwise fail
# every push). Outside the org, the ci.yml dependency-audit job
# (pip-audit + pnpm audit) is the known-CVE backstop; inside the org,
# SonarQube is the canonical SAST/supply-chain scan.
#
# Mirrors Retail-Agentic-Commerce and Retail-Catalog-Enrichment shape
# verbatim. Pinned to @main per Retail precedent (the reusable template
# is org-controlled and the maintainers track upstream there).

name: SonarQube Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonarqube:
    # The reusable template below is org-private; without this gate the
    # workflow fails on every push in any checkout outside the org.
    if: github.repository_owner == 'NVIDIA-AI-Blueprints'
    uses: NVIDIA-AI-Blueprints/sonarqube-workflows/.github/workflows/sonarqube-reusable-template.yml@main
    with:
      # Project identification
      organization: TEGRASW
      team: Blueprints
      product: vlm-feedback-loop
      scmRepoName: vlm-feedback-loop
      # Intentionally omitted: the Jenkins job does not yet accept GitHub URLs.
      # scmRepoUrl: https://github.com/NVIDIA-AI-Blueprints/vlm-feedback-loop

      # Project tags for tracking
      projectTags: CreatedBy-automation,WorkflowContact-blueprintsSre

      # Language and testing. pyproject.toml makes the default pytest target
      # tests/unit; live integration tests are explicitly invoked only by the
      # dedicated validation workflow. sonar-project.properties consumes the
      # backend-unit coverage report.
      language: python
    secrets: inherit
