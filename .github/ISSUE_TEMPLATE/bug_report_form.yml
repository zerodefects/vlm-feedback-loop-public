name: Bug Report
description: File a bug report for the Interactive VLM Feedback Loop Blueprint
title: "[BUG]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release tag or commit of vlm-feedback-loop are you running?
      placeholder: "example: main @ 3cbba76"
    validations:
      required: true

  - type: dropdown
    id: installation-method
    attributes:
      label: Which delivery mode does this occur on?
      multiple: true
      options:
        - Containerized (docker compose)
        - Local source (scripts/dev.sh)

  - type: dropdown
    id: model-path
    attributes:
      label: Which model path are you using?
      multiple: true
      options:
        - Hosted NIM endpoints (build.nvidia.com)
        - Local NIM containers (GPU)
        - Student training via TAO / Cosmos-RL

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimum reproducible example
      description: Steps (or a script) that reproduce the problem.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Backend logs, browser console output, or `docker compose logs`. Remove any API keys.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: OS, GPU model(s) and driver version (if using local NIMs), Docker/Python/Node versions.
