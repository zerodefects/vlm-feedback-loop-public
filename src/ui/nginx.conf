# Inner nginx config for the Vite SPA container.
# Serves /usr/share/nginx/html with SPA-style client-side routing fallback.
# The edge nginx (repo-root nginx.conf) reverse-proxies / to this service.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (e.g. /projects/:id/labeling) must fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits hashed filenames under /assets/ — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the shell (new deploys should show immediately)
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
